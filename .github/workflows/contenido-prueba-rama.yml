name: Prueba de contenido en la rama (vista previa)

# Generates a batch of recipes and news and commits them to THIS branch (never to main),
# so the branch's Vercel preview shows them before merging. Triggered by editing
# automatizacion/ejecutar-prueba.txt on the feature branch.
on:
  push:
    branches: [feature/contenido-automatico]
    paths: [automatizacion/ejecutar-prueba.txt]

permissions:
  contents: write

concurrency:
  group: contenido-prueba-rama
  cancel-in-progress: false

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # package-lock.json is out of date (Vercel installs with bun.lock), so install without it.
      - run: npm install --no-package-lock --no-audit --no-fund
      # sharp compresses the images; installed only here so the site build (Vercel) is untouched.
      - run: npm install --no-save --no-package-lock --no-audit --no-fund sharp

      - name: Configurar autor de los commits
        run: |
          git config user.name "Fresh Pick Contenido"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generar primera tanda en la rama
        env:
          GEMINI_API_KEY: ${{ secrets.ARANDANOS_ARTICULOS || secrets.GEMINI_API_KEY2 || secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WORKERS_AI || secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDAR_RESULTADO: automatizacion/ultimo-resultado.md
        run: |
          RECETAS=$(grep -oP '^recetas=\K[0-9]+' automatizacion/ejecutar-prueba.txt || echo 5)
          NOTICIAS=$(grep -oP '^noticias=\K[0-9]+' automatizacion/ejecutar-prueba.txt || echo 5)
          node scripts/contenido/ejecutar.mjs --rama=${{ github.ref_name }} --recetas=$RECETAS --noticias=$NOTICIAS

      - name: Guardar el resultado en la rama (también si falló)
        if: always()
        run: |
          if [ -f automatizacion/ultimo-resultado.md ]; then
            git add automatizacion/ultimo-resultado.md
            git commit -m "resultado de la tanda de prueba" || exit 0
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
          fi
